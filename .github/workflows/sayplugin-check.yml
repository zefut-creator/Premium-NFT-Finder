name: SayPlugin checks

on:
  push:
    branches: [sayplugin-v1]
  pull_request:
    branches: [sayplugin-v1]
  workflow_dispatch:

jobs:
  syntax-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile plugin source
        run: python -m py_compile plugins/sayplugin/sayplugin.plugin
      - name: Run pure-core tests
        run: python -m unittest discover -s tests -v
